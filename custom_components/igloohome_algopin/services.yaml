create_hourly_algopin:
  name: Create hourly AlgoPIN
  description: >
    Create an hourly AlgoPIN in the igloohome cloud. No Bridge is used and no
    PIN algorithm runs locally. Start and end are in the Home Assistant
    timezone and are converted to UTC hour boundaries. The PIN is returned
    only in the service response and is not stored.
  fields:
    device_id:
      name: Lock
      description: Lock chosen during setup from the account AlgoPIN device list.
      required: true
      selector:
        device:
          integration: igloohome_algopin
    access_name:
      name: Access name
      description: Sent as accessName. This is a label, not the PIN.
      required: true
      selector:
        text:
    start:
      name: Start
      description: >
        Start in the Home Assistant timezone. After conversion to UTC the time
        must fall on an hour, and it may be at most 1 hour in the past.
      required: true
      selector:
        datetime:
    end:
      name: End
      description: >
        End in the Home Assistant timezone. The UTC duration must be 1 to 672 hours.
      required: true
      selector:
        datetime:
    variance:
      name: Variance
      description: Official hourly variances are 1, 2, or 3.
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 3
          mode: box

create_daily_algopin:
  name: Create daily AlgoPIN
  description: >
    Create a daily AlgoPIN (29 to 367 whole days) in the igloohome cloud.
    Start and end are in the Home Assistant timezone and are converted to UTC.
    Both UTC hours must match. The lock is not contacted. The PIN is returned
    only in the service response and is not stored.
  fields:
    device_id:
      name: Lock
      description: Lock chosen during setup from the account AlgoPIN device list.
      required: true
      selector:
        device:
          integration: igloohome_algopin
    access_name:
      name: Access name
      description: Sent as accessName. This is a label, not the PIN.
      required: true
      selector:
        text:
    start:
      name: Start
      description: Start in the Home Assistant timezone, landing on a UTC hour.
      required: true
      selector:
        datetime:
    end:
      name: End
      description: >
        End in the Home Assistant timezone. The UTC span must be 29 to 367
        whole days and the UTC hour must match the start.
      required: true
      selector:
        datetime:
    variance:
      name: Variance
      description: Official daily variances are 1, 2, or 3.
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 3
          mode: box

revoke_algopin:
  name: Revoke AlgoPIN
  description: >
    Ask a linked Bridge to delete a PIN over Bluetooth (home API job type 5,
    jobData.pin, 4 to 9 digits). HTTP 406 means the Bridge is offline or the
    lock is not linked to that Bridge, and the code stays on the lock.
    A job id does not guarantee the lock deleted the code. The published rule
    that an unactivated AlgoPIN cannot be deleted when its start is more than
    256 hours after creation is not applied by this integration, because the
    create response is not stored. The PIN is not stored.
  fields:
    device_id:
      name: Lock
      description: Lock chosen during setup from the account AlgoPIN device list.
      required: true
      selector:
        device:
          integration: igloohome_algopin
    pin:
      name: PIN
      description: >
        The 4 to 9 digit PIN to delete. It is sent only inside the bridge job
        and is not written to Home Assistant state.
      required: true
      selector:
        text:
          type: password
    bridge_id:
      name: Bridge
      description: >
        igloohome bridge device id from the latest device list. Optional when
        exactly one Bridge is linked to the lock.
      required: false
      selector:
        text:
